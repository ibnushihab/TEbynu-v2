<!doctype html>
<html lang="id">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<style>
:root{--ink:#102a43;--muted:#66788a;--cyan:#16a6b6;--cyan2:#69d5df;--orange:#f59e0b;--paper:#f5f7f8;--line:#e5eaee;--green:#18a36b;--yellow:#d99a16;--red:#e45656;--navy:#0b2942}
*{box-sizing:border-box}body{margin:0;background:#e9eef1;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{font-weight:900;margin-right:auto}.toolbar select,.toolbar button{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 13px;font-weight:750;color:var(--ink)}.toolbar button.primary{background:var(--navy);color:white;border-color:var(--navy)}.deck{padding:28px 0 70px}.slide{width:min(1280px,calc(100vw - 40px));aspect-ratio:16/9;margin:0 auto 28px;background:#fff;border-radius:24px;box-shadow:0 18px 50px rgba(26,45,58,.10);padding:42px 48px;position:relative;overflow:hidden;display:flex;flex-direction:column}.slide:before{content:"";position:absolute;left:0;top:0;width:7px;height:100%;background:var(--cyan)}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:900}.slide h1{font-size:44px;line-height:1.03;margin:10px 0}.slide h2{font-size:30px;margin:3px 0 4px}.sub{color:var(--muted);font-size:14px}.slide-no{position:absolute;right:42px;bottom:28px;font-size:11px;color:#9aa8b3}.cover{justify-content:center;background:linear-gradient(120deg,#fff 0 67%,#eff9fa 67%)}.cover h1{font-size:58px;max-width:720px}.cover .period{font-size:22px;color:var(--muted);margin-top:8px}.cover-mark{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:220px;height:220px;border:34px solid var(--cyan);border-radius:50%;opacity:.9}.cover-mark:after{content:"";position:absolute;width:76px;height:76px;background:var(--orange);border-radius:24px;right:-50px;bottom:-20px;transform:rotate(18deg)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 12px}.kpi{padding:15px 17px;background:#f7f9fa;border-radius:16px}.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.kpi b{display:block;font-size:24px;margin-top:5px}.kpi em{font-style:normal;font-size:11px;color:var(--muted)}.main-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;min-height:0;flex:1}.chart-card{border:1px solid var(--line);border-radius:18px;padding:15px 16px;min-height:0}.chart-wrap{height:390px;min-height:390px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fbfcfc;min-height:112px}.note strong{font-size:12px}.editable{outline:none;margin-top:8px;color:#536777;font-size:12px;line-height:1.45;min-height:68px}.editable:empty:before{content:"Klik untuk isi…";color:#a6b1ba}.legend{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.dot.real{background:var(--cyan)}.dot.target{background:var(--orange)}.dot.prog{background:#8b9aab}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}.summary-card{padding:24px;border:1px solid var(--line);border-radius:20px}.summary-card span{font-size:12px;color:var(--muted);font-weight:800}.summary-card b{font-size:34px;display:block;margin-top:5px}.status{font-size:11px;font-weight:900;margin-top:7px}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.kpi.good{background:#edf9f3;border:1px solid #cdeede}.kpi.warn{background:#fff8e8;border:1px solid #f4dfaa}.kpi.bad{background:#fff1f0;border:1px solid #f4cfcc}.kpi.good b{color:var(--green)}.kpi.warn b{color:var(--yellow)}.kpi.bad b{color:var(--red)}.loading{position:fixed;inset:0;background:#fff;z-index:99;display:grid;place-items:center;font-weight:900}.error{color:var(--red)}.data-table-wrap{margin-top:8px;max-height:205px;overflow:auto;border:1px solid var(--line);border-radius:10px}.data-table{width:100%;border-collapse:collapse;font-size:9px}.data-table th,.data-table td{padding:4px 7px;border-bottom:1px solid #edf1f3;text-align:right;white-space:nowrap}.data-table th{position:sticky;top:0;background:#f8fafb;color:#66788a;font-size:8px;text-transform:uppercase;letter-spacing:.04em}.data-table th:first-child,.data-table td:first-child{text-align:left;font-weight:800}.pill{display:inline-block;padding:3px 6px;border-radius:999px;font-size:9px;font-weight:900}.pill.good{background:#e8f7f0;color:#16865b}.pill.bad{background:#fff0ee;color:#c94b40}.pill.prog{background:#eef2f5;color:#66788a}.susut-kumulatif{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.susut-kumulatif .mini{background:#f7f9fa;border-radius:12px;padding:9px 11px}.susut-kumulatif small{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}.susut-kumulatif b{display:block;font-size:16px;margin-top:3px}
@media(max-width:900px){.slide{width:calc(100vw - 18px);padding:26px;aspect-ratio:auto;min-height:720px}.main-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.cover-mark{display:none}.toolbar{flex-wrap:wrap}.brand{width:100%}.slide h1{font-size:40px}}
@media print{body{background:white}.toolbar,.loading{display:none!important}.deck{padding:0}.slide{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:0;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}.editable:empty:before{content:""}}
</style>
</head>
<body>
<div id="loading" class="loading">Menyiapkan paparan…</div>
<div class="toolbar"><div class="brand">TE by Nu · Paparan</div><select id="year"><option>2026</option></select><select id="month"></select><button onclick="location.href='index.html'">Kembali</button><button onclick="present()">Presentasi</button><button class="primary" id="pptBtn">Download PPT</button></div>
<div id="deck" class="deck"></div>
<script>
const $=id=>document.getElementById(id);
const year=$('year'),month=$('month'),loading=$('loading'),deck=$('deck'),pptBtn=$('pptBtn');
const SUPABASE_URL='https://xwjcpmxgsjjbrphbiipq.supabase.co';
const SUPABASE_KEY='sb_publishable_spj0cvuxeqTxqyk__WQFmw_MfPQw1aJ';
let db=null;
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const short=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:0}), pct=n=>n==null?'–':Number(n).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
let DATA={}, charts=[];
month.innerHTML=MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
function calcSusut(r){const p=+r.penerimaan||0,t=+r.terima_unit_lain||0,masuk=p+t;if(!masuk)return null;return (masuk-(+r.jual_tt||0)-(+r.jual_tm||0)-(+r.jual_tr||0)-(+r.kirim_unit_lain||0)-(+r.pemakaian_sendiri||0)+(+r.emin_tm||0)+(+r.emin_tr||0))/masuk*100}
function cumulative(rows,end){let p=0,t=0,jtt=0,jtm=0,jtr=0,k=0,ps=0,emt=0,etr=0;rows.filter(r=>+r.bulan<=end).forEach(r=>{p+=+r.penerimaan||0;t+=+r.terima_unit_lain||0;jtt+=+r.jual_tt||0;jtm+=+r.jual_tm||0;jtr+=+r.jual_tr||0;k+=+r.kirim_unit_lain||0;ps+=+r.pemakaian_sendiri||0;emt+=+r.emin_tm||0;etr+=+r.emin_tr||0});const masuk=p+t;return masuk?(masuk-jtt-jtm-jtr-k-ps+emt+etr)/masuk*100:null}
function prognosis(actual,last){const vals=[];for(let i=1;i<=last;i++){const v=actual[i-1];if(v!=null)vals.push({x:i,y:v})}const tail=vals.slice(-3);if(!tail.length)return Array(12).fill(null);let slope=0;if(tail.length>1){const xm=tail.reduce((a,b)=>a+b.x,0)/tail.length,ym=tail.reduce((a,b)=>a+b.y,0)/tail.length;const den=tail.reduce((a,b)=>a+(b.x-xm)**2,0);slope=den?tail.reduce((a,b)=>a+(b.x-xm)*(b.y-ym),0)/den:0}const base=tail[tail.length-1].y,out=Array(12).fill(null);for(let m=last+1;m<=12;m++)out[m-1]=Math.max(-5,Math.min(30,base+slope*(m-last)));return out}
async function load(){
 try{
  loading.style.display='grid'; loading.textContent='Menyiapkan paparan…';
  if(!window.supabase?.createClient) throw new Error('Library Supabase gagal dimuat. Refresh halaman.');
  if(!window.Chart) throw new Error('Library grafik gagal dimuat. Refresh halaman.');
  if(!db) db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const y=+year.value;
  const [h,t,l,su,tr]=await Promise.all([
   db.from('p2tl_harian').select('*').gte('tanggal',`${y}-01-01`).lte('tanggal',`${y}-12-31`).order('tanggal'),
   db.from('target_tahunan').select('*').eq('tahun',y).limit(1),
   db.from('lbkb_bulanan').select('*').eq('tahun',y).order('bulan'),
   db.from('susut_bulanan').select('*').eq('tahun',y).order('bulan'),
   db.from('target_susut').select('*').eq('tahun',y).order('bulan')
  ]);
  const failed=[h,t,l,su,tr].find(x=>x?.error); if(failed) throw failed.error;
  DATA={harian:h.data||[],target:t.data?.[0]||{},lbkb:l.data||[],susut:su.data||[],_targetSusut:tr.data||[]};
  const ms=[...DATA.susut.map(x=>+x.bulan||0),...DATA.harian.map(x=>{const d=new Date(x.tanggal+'T00:00:00');return Number.isNaN(d.getTime())?0:d.getMonth()+1})];
  month.value=Math.max(1,...ms);
  await render();
 }catch(e){
  console.error('Paparan init error:',e);
  deck.innerHTML=`<section class="slide"><div class="eyebrow">Paparan Kinerja Transaksi Energi</div><h2>Paparan belum bisa dimuat</h2><div class="sub error">${String(e?.message||e)}</div></section>`;
 }finally{ loading.style.display='none'; }
}
function monthly(){const a=Array.from({length:12},()=>({p2tl:0,meter:0,ada:false}));DATA.harian.forEach(r=>{const m=new Date(r.tanggal+'T00:00:00').getMonth();a[m].p2tl+=+r.p2tl_kwh||0;a[m].meter+=+r.ganti_meter||0;a[m].ada=true});return a}
function perfClass(p){return p>=91?'good':p>=80?'warn':'bad'}
function hasSusutActual(r){return !!r && ((+r.penerimaan||0)+(+r.terima_unit_lain||0)>0)}
function monthlySusutActual(maxMonth=12){return Array.from({length:12},(_,i)=>{if(i+1>maxMonth)return null;const r=DATA.susut.find(x=>+x.bulan===i+1&&hasSusutActual(x));return r?calcSusut(r):null})}
function prognosisMonthly(actual,last,until){const out=Array(12).fill(null);if(!last)return out;const lastActual=actual[last-1];if(lastActual==null)return out;const end=Math.min(until,12);if(end<=last)return out;/* Proyeksi perbaikan moderat, bukan dipaksa menyentuh target: turun sekitar 0,12 poin persentase per bulan, maksimal 0,45 poin sampai akhir periode. */const months=end-last;const totalImprove=Math.min(0.45,0.12*months);const finish=Math.max(0,lastActual-totalImprove);for(let i=last;i<end;i++){const step=(i-last+1)/months;out[i]=lastActual+(finish-lastActual)*step;}return out}
function notes(key){return `<div class="notes">${['Action Plan','Strategi','Kendala','Need to Support'].map((x,i)=>`<div class="note"><strong>${x}</strong><div class="editable" contenteditable="true" data-note="${key}-${i}"></div></div>`).join('')}</div>`}
function slide(title,sub,kpis,canvas,key,extra=''){return `<section class="slide"><div class="eyebrow">Paparan Kinerja Transaksi Energi</div><h2>${title}</h2><div class="sub">${sub}</div><div class="kpis">${kpis}</div><div class="main-grid"><div class="chart-card"><div class="chart-wrap"><canvas id="${canvas}"></canvas></div>${extra}</div>${notes(key)}</div><div class="slide-no">TE by Nu · ${MONTHS[+month.value-1]} ${year.value}</div></section>`}
const kpi=(a,b,c='',cls='')=>`<div class="kpi ${cls}"><small>${a}</small><b>${b}</b><em>${c}</em></div>`;
async function render(){
 charts.forEach(c=>c.destroy());charts=[];
 const m=+month.value,y=+year.value,mo=monthly(),pt=+DATA.target.p2tl_target_kwh||0,mt=+DATA.target.ganti_meter_target||0;
 const pY=mo.slice(0,m).reduce((a,b)=>a+b.p2tl,0),mY=mo.slice(0,m).reduce((a,b)=>a+b.meter,0),pTar=pt/12*m,mTar=mt/12*m;
 const lb=DATA.lbkb.find(x=>+x.bulan===m)||{},lbY=DATA.lbkb.filter(x=>+x.bulan<=m).reduce((a,b)=>({t:a.t+(+b.target||0),r:a.r+(+b.realisasi||0)}),{t:0,r:0});
 const availableSusut=DATA.susut.filter(x=>+x.bulan<=m&&hasSusutActual(x)).sort((a,b)=>+a.bulan-+b.bulan), lastSusut=availableSusut.length?+availableSusut.at(-1).bulan:0;
 const susCum=lastSusut?cumulative(DATA.susut,lastSusut):null, susTargetRow=DATA._targetSusut.find(x=>+x.bulan===lastSusut), susTarget=susTargetRow?+susTargetRow.target_susut:null, susGap=(susCum!=null&&susTarget!=null)?susCum-susTarget:null;
 const susActual=monthlySusutActual(m), susProg=prognosisMonthly(susActual,lastSusut,12);
 const pCap=pTar?pY/pTar*100:null, mCap=mTar?mY/mTar*100:null, lbCap=+lb.target?(+lb.realisasi||0)/+lb.target*100:null;
 const susCls=susGap==null?'':susGap<=0?'good':(susTarget&&susGap<=susTarget*.10?'warn':'bad');
 deck.innerHTML=`<section class="slide cover"><div class="eyebrow">TE by Nu</div><h1>Paparan Kinerja Transaksi Energi</h1><div class="period">ULP Sungai Penuh · ${MONTHS[m-1]} ${y}</div><div class="cover-mark"></div><div class="slide-no">Monitoring · Analysis · Action</div></section>`+
 slide('P2TL',`Kinerja s.d. ${MONTHS[m-1]} ${y}`,kpi('Target s.d.',fmt(pTar)+' kWh')+kpi('Realisasi s.d.',fmt(pY)+' kWh')+kpi('Capaian',pct(pCap),'',perfClass(pCap))+kpi('Gap',fmt(pY-pTar)+' kWh','',perfClass(pCap)),'p2tlChart','p2tl','<div class="legend"><span><i class="dot real"></i>Realisasi</span><span><i class="dot target"></i>Target</span></div>')+
 slide('Harmet / Ganti kWh Meter',`Kinerja s.d. ${MONTHS[m-1]} ${y}`,kpi('Target s.d.',fmt(mTar)+' pelanggan')+kpi('Realisasi s.d.',fmt(mY)+' pelanggan')+kpi('Capaian',pct(mCap),'',perfClass(mCap))+kpi('Gap',fmt(mY-mTar)+' pelanggan','',perfClass(mCap)),'meterChart','meter','<div class="legend"><span><i class="dot real"></i>Realisasi</span><span><i class="dot target"></i>Target</span></div>')+
 slide('LBKB',`Kinerja ${MONTHS[m-1]} ${y}`,kpi('Target bulan ini',fmt(lb.target))+kpi('Realisasi bulan ini',fmt(lb.realisasi))+kpi('Capaian',pct(lbCap),'',perfClass(lbCap))+kpi('Realisasi s.d.',fmt(lbY.r),'',perfClass(lbCap)),'lbkbChart','lbkb','<div class="legend"><span><i class="dot real"></i>Realisasi</span><span><i class="dot target"></i>Target</span></div>')+
 slide('Susut Distribusi',lastSusut?`Data aktual terakhir: ${MONTHS[lastSusut-1]} ${y} · Paparan ${MONTHS[m-1]} ${y}`:`Belum ada data Susut sampai ${MONTHS[m-1]} ${y}`,kpi('Susut Kumulatif',pct(susCum),'',susCls)+kpi('Target Kumulatif',pct(susTarget))+kpi('Gap',susGap==null?'–':(susGap>0?'+':'')+pct(susGap),'',susCls)+kpi('Aktual Terakhir',lastSusut?MONTHS[lastSusut-1]:'–'),'susutChart','susut','<div class="legend"><span><i class="dot real"></i>Realisasi Bulanan</span><span><i class="dot prog"></i>Proyeksi Pencapaian Target</span></div>');
 restoreNotes(); await drawCharts(m,mo,pt,mt,lastSusut,susActual,susProg);
}
const valueLabelPlugin={id:'valueLabels',afterDatasetsDraw(chart,args,pluginOptions){const {ctx}=chart;ctx.save();chart.data.datasets.forEach((ds,di)=>{const meta=chart.getDatasetMeta(di);if(meta.hidden)return;meta.data.forEach((el,i)=>{const raw=ds.data[i];if(raw==null||raw===''||!Number.isFinite(Number(raw)))return;const v=Number(raw);const isPct=chart.canvas.id==='susutChart';const label=isPct?v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':Math.round(v).toLocaleString('id-ID');const isLine=ds.type==='line'||chart.config.type==='line';ctx.font='800 10px Inter, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillStyle=ds.borderColor||'#172033';let x=el.x,y=el.y-(isLine?8:5);if(y<16){y=el.y+16;ctx.textBaseline='top'}ctx.fillText(label,x,y);});});ctx.restore();}};
Chart.register(valueLabelPlugin);
function chart(id,type,data,opts={}){const c=new Chart(document.getElementById(id),{type,data,options:{responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{top:22,left:6,right:6}},plugins:{legend:{display:false},tooltip:{backgroundColor:'#102a43',padding:10,cornerRadius:10}},scales:{x:{grid:{display:false},border:{display:false},ticks:{color:'#738391',font:{size:10,weight:700}}},y:{grid:{color:'#edf1f3'},border:{display:false},ticks:{color:'#8b99a5',font:{size:9}}}},...opts}});charts.push(c);return c}
async function drawCharts(m,mo,pt,mt,lastSusut,susActual,susProg){
 const labels=short.slice(0,m),realColor='#16a6b6',targetColor='#f59e0b';
 chart('p2tlChart','bar',{labels,datasets:[{label:'Realisasi',data:mo.slice(0,m).map(x=>x.ada?x.p2tl:null),backgroundColor:realColor,borderRadius:9},{type:'line',label:'Target',data:labels.map(()=>pt/12),borderColor:targetColor,borderDash:[7,6],borderWidth:2,pointRadius:0}]});
 chart('meterChart','bar',{labels,datasets:[{label:'Realisasi',data:mo.slice(0,m).map(x=>x.ada?x.meter:null),backgroundColor:realColor,borderRadius:9},{type:'line',label:'Target',data:labels.map(()=>mt/12),borderColor:targetColor,borderDash:[7,6],borderWidth:2,pointRadius:0}]});
 const lb=Array.from({length:m},(_,i)=>DATA.lbkb.find(x=>+x.bulan===i+1)||{});chart('lbkbChart','bar',{labels,datasets:[{label:'Realisasi',data:lb.map(x=>x.realisasi==null?null:+x.realisasi),backgroundColor:realColor,borderRadius:9},{type:'line',label:'Target',data:lb.map(x=>x.target==null?null:+x.target),borderColor:targetColor,borderDash:[7,6],borderWidth:2,pointRadius:0}]});
 const susutLabels=short.slice(0,12);
 chart('susutChart','line',{labels:susutLabels,datasets:[{label:'Realisasi Bulanan',data:susActual,borderColor:realColor,backgroundColor:realColor,borderWidth:3,pointRadius:3,tension:.28,spanGaps:false},{label:'Proyeksi Pencapaian Target',data:susProg,borderColor:'#8b9aab',borderDash:[6,5],borderWidth:2,pointRadius:2,tension:.28,spanGaps:false}]});
}
function saveNotes(){document.querySelectorAll('.editable').forEach(e=>localStorage.setItem(`paparan:${year.value}:${month.value}:${e.dataset.note}`,e.innerHTML))}function restoreNotes(){document.querySelectorAll('.editable').forEach(e=>{e.innerHTML=localStorage.getItem(`paparan:${year.value}:${month.value}:${e.dataset.note}`)||'';e.addEventListener('input',saveNotes)})}
function present(){document.documentElement.requestFullscreen?.()}
year.addEventListener('change',load);
month.addEventListener('change',()=>render().catch(e=>console.error('Render error:',e)));
pptBtn.addEventListener('click',async()=>{
  saveNotes();
  const oldText=pptBtn.textContent;
  pptBtn.disabled=true; pptBtn.textContent='Menyiapkan PPT…';
  try{
    const pptx=new PptxGenJS();
    pptx.layout='LAYOUT_WIDE';
    pptx.author='TE by Nu';
    pptx.subject='Paparan Kinerja';
    pptx.title=`Paparan TE ${MONTHS[+month.value-1]} ${year.value}`;
    pptx.company='PLN';
    pptx.lang='id-ID';
    pptx.theme={headFontFace:'Aptos Display',bodyFontFace:'Aptos',lang:'id-ID'};
    const slides=[...document.querySelectorAll('.slide')];
    for(const el of slides){
      const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
      const data=canvas.toDataURL('image/png');
      const slide=pptx.addSlide();
      slide.background={color:'FFFFFF'};
      slide.addImage({data,x:0,y:0,w:13.333,h:7.5});
    }
    await pptx.writeFile({fileName:`Paparan_TE_${MONTHS[+month.value-1]}_${year.value}.pptx`});
  }catch(e){
    console.error(e);
    alert('PPT belum berhasil dibuat: '+(e?.message||e));
  }finally{
    pptBtn.disabled=false; pptBtn.textContent=oldText;
  }
});
window.addEventListener('DOMContentLoaded',load);
</script>
</body></html>
